[package]
name = "runtara-workflow-api-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Turns a compiled workflow's entry into wasi:cli/run over the workflow API"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
runtara-workflow-sdk = { path = "../runtara-workflow-sdk" }
runtara-workflow-api = { path = "../runtara-workflow-api" }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true, features = ["async-spawn"] }
