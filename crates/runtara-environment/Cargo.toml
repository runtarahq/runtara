[package]
name = "runtara-environment"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Environment server for runtara - image registry, workflow runner, and instance management"
keywords = ["durable", "workflow", "wasm", "wasmtime"]
categories = ["asynchronous", "development-tools"]

[lib]
name = "runtara_environment"
path = "src/lib.rs"

[features]
db-integration-tests = []

# Needs the real database: it pre-seeds what the SDK would have reported so
# run()'s output/error mapping can be exercised against real persistence.
[[test]]
name = "embedded_runner_test"
required-features = ["db-integration-tests"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
opentelemetry = { version = "0.32", features = ["metrics"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "macros", "migrate"] }

# Core persistence layer (for shared database access)
runtara-core = { path = "../runtara-core", version = "8.9" }

# Embedded wasmtime workflow execution (EmbeddedWasmRunner)
runtara-component-host = { path = "../runtara-component-host", version = "8.9" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.3"

# Base64 for the wire-shaped payloads the management protocol reports.
base64 = "0.22"

# Async trait
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"
futures = "0.3"
# Embedded-runner tests author minimal wasi:cli/run components in WAT.
wat = "1"
# Testcontainers for automatic PostgreSQL setup in tests
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[[test]]
name = "container_registry_test"
path = "tests/container_registry_test.rs"
required-features = ["db-integration-tests"]

[[test]]
name = "instance_metrics_test"
path = "tests/instance_metrics_test.rs"
required-features = ["db-integration-tests"]

[[test]]
name = "db_cleanup_worker_test"
path = "tests/db_cleanup_worker_test.rs"
required-features = ["db-integration-tests"]

[[test]]
name = "db_test"
path = "tests/db_test.rs"
required-features = ["db-integration-tests"]

[[test]]
name = "handlers_test"
path = "tests/handlers_test.rs"
required-features = ["db-integration-tests"]

[[test]]
name = "heartbeat_monitor_test"
path = "tests/heartbeat_monitor_test.rs"
required-features = ["db-integration-tests"]

[[test]]
name = "image_registry_test"
path = "tests/image_registry_test.rs"
required-features = ["db-integration-tests"]

[[test]]
name = "launch_queue_test"
path = "tests/launch_queue_test.rs"
required-features = ["db-integration-tests"]

[[test]]
name = "wake_scheduler_test"
path = "tests/wake_scheduler_test.rs"
required-features = ["db-integration-tests"]
