[package]
name = "runtara-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native agent implementations for runtara workflows"
keywords = ["durable", "workflow", "agents"]
categories = ["development-tools"]

[lib]
name = "runtara_agents"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = ["native"]

# Native platform — the one remaining C-dependent agent (SFTP via libssh2).
#
# XLSX and Compression used to live here too; both are WASM components now
# (`crates/agents/runtara-agent-{xlsx,compression}`), which took `calamine` and
# `zip` out of this crate entirely.
#
# `ssh2` links libssh2, which needs OpenSSL. By default that resolves against
# the *system* OpenSSL (libssl-dev on Linux, `brew install openssl@3` on macOS).
# Building OpenSSL from source instead is a 2-minute serial C compile that lands
# on the critical path of every cold build, so it is opt-in via
# `vendored-openssl` rather than implied here.
native = [
    "dep:ssh2",
    "runtara-http/native",
]

# Build OpenSSL from vendored source instead of linking the system library.
# Only needed for a fully static (e.g. musl) link; no target in this repo's
# release pipeline uses it today — bundles are *-linux-gnu / *-apple-darwin and
# the Docker image ships a dynamically-linked binary. Kept so a static lane can
# turn it back on with one flag.
vendored-openssl = ["dep:openssl"]

# WASI target (wasm32-wasip2) - HTTP via wasi-http, no SFTP
wasi = ["runtara-http/wasi"]

[dependencies]
runtara-dsl = { path = "../runtara-dsl", version = "8.7" }
runtara-agent-macro = { path = "../runtara-agent-macro", version = "8.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
base64 = "0.22"
strum = { version = "0.26", features = ["derive"] }
# HTTP abstraction used by the standalone S3 client (s3_client.rs)
runtara-http = { workspace = true, default-features = false }
# Native-only agents — C deps that don't compile to WASM
ssh2 = { version = "0.9", optional = true }
# Pulled in only by the `vendored-openssl` feature. Never referenced from this
# crate's source — its sole job is to make openssl-sys build OpenSSL from source
# for ssh2/libssh2-sys instead of linking the system library.
openssl = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
wiremock = "0.6"
serial_test = "3"
