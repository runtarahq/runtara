[package]
name = "runtara-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host support and connection schemas for runtara workflows"
keywords = ["durable", "workflow", "agents"]
categories = ["development-tools"]

[lib]
name = "runtara_agents"
path = "src/lib.rs"
crate-type = ["rlib"]

[features]
default = ["native"]

# Native HTTP transport for the server's standalone S3 client.
native = ["runtara-http/native"]

# WASI HTTP transport for shared support consumers.
wasi = ["runtara-http/wasi"]

[dependencies]
runtara-dsl = { path = "../runtara-dsl", version = "8.9" }
runtara-agent-macro = { path = "../runtara-agent-macro", version = "8.9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
base64 = "0.22"
strum = { version = "0.26", features = ["derive"] }
# HTTP abstraction used by the standalone S3 client (s3_client.rs)
runtara-http = { workspace = true, default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
wiremock = "0.6"
serial_test = "3"
