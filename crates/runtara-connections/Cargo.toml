[package]
name = "runtara-connections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Connection management for runtara — CRUD, OAuth2, rate limiting"
publish = false
keywords = ["durable", "workflow", "connections", "oauth"]
categories = ["web-programming"]

[features]
default = []
utoipa = ["dep:utoipa"]

[dependencies]
# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "json"] }

# HTTP
axum = "0.8"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "aio", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
hex = "0.4"
# The normal connection/OAuth path keeps its default TLS backend. HTTP mTLS
# explicitly selects Rustls because reqwest's PEM identity support is provided
# by the Rustls backend.
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
urlencoding = "2"
url = "2"

# Auth resolution (provider auth, token cache, SigV4 signing)
dashmap = "6.1"
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
# Async single-flight lock around OAuth token refresh + guarded DNS resolution
# for the hardened egress client (host-only crate)
tokio = { version = "1", features = ["sync", "net"] }

# At-rest encryption for connection parameters
aes-gcm = "0.10"
zeroize = "1.8"

# Error handling
thiserror = "2"
async-trait = "0.1"

# Logging / metrics
tracing = "0.1"
opentelemetry = { version = "0.32", features = ["metrics"] }

# Connection type metadata
runtara-dsl = { path = "../runtara-dsl" }
runtara-agents = { path = "../runtara-agents", default-features = false }

# OpenAPI (optional)
utoipa = { version = "5", optional = true }

[dev-dependencies]
# Tests require native HTTP; library metadata consumers disable the transport.
runtara-http = { workspace = true, features = ["native"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
