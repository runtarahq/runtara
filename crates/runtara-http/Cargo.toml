[package]
name = "runtara-http"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP client abstraction for runtara — native (ureq) and WASI backends"
keywords = ["http", "wasi", "client"]
categories = ["web-programming::http-client"]

[features]
# No default backend — every consumer must opt in to exactly one. This is
# deliberate: a cfg-target-gated `ureq` dep would land in every transitive
# consumer's Cargo.lock (rustls, ring, icu_*, …) even for builds that
# never compile it. Feature-gating keeps wasm consumers' lockfiles clean.
default = []

# Native blocking HTTP via ureq (any non-wasm target).
native = ["dep:ureq"]

# WASM HTTP over the workflow API (`POST /v1/http`), through the guest SDK.
wasi = ["dep:wit-bindgen", "dep:runtara-workflow-sdk", "dep:runtara-workflow-api"]

[dependencies]
# The guest SDK and its contract; `block_on` drives an async call from
# synchronous capability code.
wit-bindgen = { workspace = true, optional = true, features = ["async-spawn"] }
runtara-workflow-sdk = { path = "../runtara-workflow-sdk", optional = true }
runtara-workflow-api = { path = "../runtara-workflow-api", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"

ureq = { version = "2", features = ["json", "tls"], optional = true }
