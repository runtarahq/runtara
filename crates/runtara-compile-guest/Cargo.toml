[package]
name = "runtara-compile-guest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The workflow compiler as a WASI command that compiles one request over the workflow API, with no filesystem"
publish = false

[dependencies]
runtara-workflows = { path = "../runtara-workflows" }
runtara-workflow-api = { path = "../runtara-workflow-api" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "wasi")'.dependencies]
wasi = "=0.14.2"
