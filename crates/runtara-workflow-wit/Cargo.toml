[package]
name = "runtara-workflow-wit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical WIT packages for runtara workflow stdlib/runtime components"
keywords = ["wasm", "component-model", "wit", "workflow"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[features]
# Host/compiler package contract; guest users of the WIT constants remain light.
isolation-package = ["dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
wit-parser = "0.246"
