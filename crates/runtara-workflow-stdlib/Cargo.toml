[package]
name = "runtara-workflow-stdlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Manifest evaluator component for direct-emitted runtara workflow Wasm"
keywords = ["durable", "workflow", "stdlib", "wasm"]
categories = ["development-tools"]

[lib]
name = "runtara_workflow_stdlib"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# No target backends: this crate is pure JSON evaluation, so the same code
# builds for every target. `direct-component` adds the wit-bindgen export
# glue for the wasm32-wasip2 component build; without it the crate is a
# plain rlib for `runtara-workflows`.
default = []
direct-component = ["dep:wit-bindgen"]

[dependencies]
# Export glue for the wasm32-wasip2 component build.
wit-bindgen = { version = "0.58", optional = true }

serde = { workspace = true }
serde_json = { workspace = true }

# Template rendering for MappingValue::Template.
# `json` enables the `tojson` filter (default features stay on).
minijinja = { version = "2.5", features = ["json"] }
