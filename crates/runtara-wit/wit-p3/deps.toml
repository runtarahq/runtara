http = { url = "https://github.com/WebAssembly/WASI/archive/v0.3.0.tar.gz", prefix = "WASI-0.3.0/proposals/http/wit" }
random = { url = "https://github.com/WebAssembly/WASI/archive/v0.3.0.tar.gz", prefix = "WASI-0.3.0/proposals/random/wit" }
sockets = { url = "https://github.com/WebAssembly/WASI/archive/v0.3.0.tar.gz", prefix = "WASI-0.3.0/proposals/sockets/wit" }
