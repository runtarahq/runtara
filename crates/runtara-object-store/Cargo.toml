[package]
name = "runtara-object-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Schema-driven dynamic PostgreSQL object store"
license.workspace = true
# Was https://github.com/runtarahq/runtara-object-store — this crate has never
# lived in its own repository; it is a member of the runtara workspace.
repository.workspace = true
readme = "README.md"
keywords = ["postgresql", "schema", "dynamic", "object-store", "database"]
categories = ["database"]
publish = false

[features]
db-integration-tests = []

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["db-integration-tests"]

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "rust_decimal", "uuid", "tls-rustls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
regex = "1"
rust_decimal = { version = "1", features = ["db-postgres"] }
pgvector = { version = "0.4", features = ["sqlx"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
