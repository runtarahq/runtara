[package]
name = "runtara-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core execution engine for runtara - manages instances, checkpoints, signals, and durable sleep"
keywords = ["durable", "workflow", "execution", "checkpoint"]
categories = ["asynchronous", "development-tools"]

[lib]
name = "runtara_core"
path = "src/lib.rs"

[features]

# Exposes the in-memory `Persistence` mock so downstream crates — chiefly the
# instance HTTP API, which now lives in runtara-server — can test handler
# wiring without external services.
test-support = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging/tracing
tracing = "0.1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
