[package]
name = "runtara-core"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core execution engine for runtara - manages instances, checkpoints, signals, and durable sleep"
keywords = ["durable", "workflow", "execution", "checkpoint"]
categories = ["asynchronous", "development-tools"]

[lib]
name = "runtara_core"
path = "src/lib.rs"

[features]
db-integration-tests = []

# Exposes the in-memory `Persistence` mock so downstream crates — chiefly the
# instance HTTP API, which now lives in runtara-server — can test handler
# wiring without a database.
test-support = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "macros", "migrate"] }


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
# Testcontainers for automatic PostgreSQL setup in tests
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
