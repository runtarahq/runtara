[package]
name = "runtara-runner-delegate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A workflow runner outside runtara-environment that delegates to the embedded one: the proof that runtara-server takes a pluggable runner"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "runtara-server-delegating"
path = "src/bin/runtara-server-delegating.rs"

[dependencies]
async-trait = "0.1"
runtara-environment = { path = "../runtara-environment" }
runtara-server = { path = "../runtara-server" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
