mutation chargePaymentMethod(
  $paymentMethodId: ID!
  $amount: Amount!
  $orderId: String
  $merchantAccountId: ID
  $apiRequestKey: String
) {
  chargePaymentMethod(
    input: {
      paymentMethodId: $paymentMethodId
      apiRequestKey: $apiRequestKey
      transaction: {amount: $amount, orderId: $orderId, merchantAccountId: $merchantAccountId}
    }
  ) {
    transaction {
      ...TransactionFields
    }
  }
}

fragment TransactionFields on Transaction {
  id
  legacyId
  status
  orderId
  createdAt
  merchantAccountId
  amount {
    value
    currencyCode
  }
  processorAuthorizationResponse {
    legacyCode
    message
    cvvResponse
    avsPostalCodeResponse
    avsStreetAddressResponse
  }
  paymentMethodSnapshot {
    __typename
    ... on CreditCardDetails {
      brandCode
      last4
      expirationMonth
      expirationYear
    }
    ... on CreditCardTransactionDetails {
      creditCard {
        brandCode
        last4
        expirationMonth
        expirationYear
      }
    }
    ... on PayPalTransactionDetails {
      authorizationId
      captureId
      payer {
        email
        payerId
      }
    }
  }
  customer {
    id
    email
  }
}
