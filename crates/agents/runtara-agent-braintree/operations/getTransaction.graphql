query getTransaction($id: ID!) {
  node(id: $id) {
    ...TransactionFields
    ... on Transaction {
      statusHistory {
        status
        timestamp
        amount {
          value
          currencyCode
        }
      }
      refunds {
        id
        status
        createdAt
        amount {
          value
          currencyCode
        }
      }
    }
  }
}

fragment TransactionFields on Transaction {
  id
  legacyId
  status
  orderId
  createdAt
  merchantAccountId
  amount {
    value
    currencyCode
  }
  processorAuthorizationResponse {
    legacyCode
    message
    cvvResponse
    avsPostalCodeResponse
    avsStreetAddressResponse
  }
  paymentMethodSnapshot {
    __typename
    ... on CreditCardDetails {
      brandCode
      last4
      expirationMonth
      expirationYear
    }
    ... on CreditCardTransactionDetails {
      creditCard {
        brandCode
        last4
        expirationMonth
        expirationYear
      }
    }
    ... on PayPalTransactionDetails {
      authorizationId
      captureId
      payer {
        email
        payerId
      }
    }
  }
  customer {
    id
    email
  }
}
