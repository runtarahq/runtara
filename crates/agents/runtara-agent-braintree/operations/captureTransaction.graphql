mutation captureTransaction($transactionId: ID!, $amount: Amount, $apiRequestKey: String) {
  captureTransaction(
    input: {transactionId: $transactionId, apiRequestKey: $apiRequestKey, transaction: {amount: $amount}}
  ) {
    transaction {
      ...TransactionFields
    }
  }
}

fragment TransactionFields on Transaction {
  id
  legacyId
  status
  orderId
  createdAt
  merchantAccountId
  amount {
    value
    currencyCode
  }
  processorAuthorizationResponse {
    legacyCode
    message
    cvvResponse
    avsPostalCodeResponse
    avsStreetAddressResponse
  }
  paymentMethodSnapshot {
    __typename
    ... on CreditCardDetails {
      brandCode
      last4
      expirationMonth
      expirationYear
    }
    ... on CreditCardTransactionDetails {
      creditCard {
        brandCode
        last4
        expirationMonth
        expirationYear
      }
    }
    ... on PayPalTransactionDetails {
      authorizationId
      captureId
      payer {
        email
        payerId
      }
    }
  }
  customer {
    id
    email
  }
}
