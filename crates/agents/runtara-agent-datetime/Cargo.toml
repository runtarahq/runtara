[package]
name = "runtara-agent-datetime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DateTime agent — date/time manipulation — as a WebAssembly component"
keywords = ["wasm", "component", "agent", "datetime"]
categories = ["wasm", "date-and-time"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
runtara-agent-macro = { workspace = true }
runtara-dsl = { workspace = true }
strum = { version = "0.26", features = ["derive"] }
