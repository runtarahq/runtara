# Input to scripts/connector_gen/connector_gen.py; see its README.md.
agent:
  id: zendesk
  name: Zendesk
  description: Zendesk Support — tickets, comments, users, organizations, groups and search.
  integration_id: zendesk_client_credentials
  error_prefix: ZENDESK
spec:
