  - ShowTicket
  - CreateTicket
  - UpdateTicket
  - DeleteTicket
  - ListTicketComments
  - ListSearchResults
  - ExportSearchResults
  - ShowUser
  - SearchUsers
  - CreateUser
  - UpdateUser
  - CreateOrUpdateUser
  - ShowCurrentUser
  - ShowOrganization
  - CreateOrganization
  - UpdateOrganization
  - ListGroups
  - ListTicketFields
