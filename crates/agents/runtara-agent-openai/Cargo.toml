[package]
name = "runtara-agent-openai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenAI integration agent — WebAssembly Component"
keywords = ["wasm", "component", "agent", "openai", "llm"]
categories = ["wasm", "web-programming::http-client"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
runtara-agent-macro = { workspace = true }
runtara-dsl = { workspace = true }
# Shared per-provider default model ids (runtara_ai::defaults); wasm-safe with
# default features off, matching how runtara-agent-ai-tools consumes runtara-ai.
runtara-ai = { path = "../../runtara-ai", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
runtara-http = { workspace = true, features = ["native"] }

[target.'cfg(target_family = "wasm")'.dependencies]
runtara-http = { workspace = true, features = ["wasi"] }
