# Input to scripts/connector_gen/connector_gen.py; see its README.md.
agent:
  id: jira
  name: Jira
  description: Jira Cloud — issues, JQL search, transitions, comments, worklogs, links, watchers, projects and users.
  integration_id: jira_api_token
  error_prefix: JIRA
spec:
  # REST API v2 in OpenAPI 3 form: v2 takes and returns plain text where v3 uses
  # Atlassian Document Format. dac-static.atlassian.com serves another build.
  url: https://developer.atlassian.com/cloud/jira/platform/swagger.v3.json
  sha256: 9366c823a80d7e9c3160f816b37d38edcf39345b075f0102de20927c5215683b
# The spec does not mark it nullable, but assignIssue documents null as unassign.
input_types:
  accountId:
    type: string
    nullable: true
  # A plain object, as the typed operations would drop the null in {"set": null},
  # which clears a field. The step editor shows either form as one object.
  update:
    type: object
    additionalProperties: {}
operations:
  - getIssue
  - createIssue
  - editIssue
  - deleteIssue
  - assignIssue
  - getTransitions
  - doTransition
  - getChangeLogs
  - searchAndReconsileIssuesUsingJql
  - getComments
  - getComment
  - addComment
  - updateComment
  - deleteComment
  - getIssueWorklog
  - addWorklog
  - linkIssues
  - getIssueLinkTypes
  - getIssueWatchers
  - addWatcher
  - searchProjects
  - getProject
  - getProjectComponents
  - getProjectVersions
  - getAllStatuses
  - getCreateIssueMetaIssueTypes
  - getCreateIssueMetaIssueTypeId
  - getFields
  - searchPriorities
  - getCurrentUser
  - findUsers
  - getUser
