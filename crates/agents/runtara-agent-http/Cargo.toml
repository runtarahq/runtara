[package]
name = "runtara-agent-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic HTTP request agent — WebAssembly Component"
keywords = ["wasm", "component", "agent", "http"]
categories = ["wasm", "web-programming::http-client"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
runtara-agent-macro = { workspace = true }
runtara-dsl = { workspace = true }
strum = { version = "0.26", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
runtara-http = { workspace = true, features = ["native"] }

[target.'cfg(target_family = "wasm")'.dependencies]
runtara-http = { workspace = true, features = ["wasi"] }
