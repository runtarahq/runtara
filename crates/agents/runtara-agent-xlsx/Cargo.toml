[package]
name = "runtara-agent-xlsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Spreadsheet agent — XLSX/XLS/XLSB/ODS parsing as a WebAssembly Component"
keywords = ["wasm", "component", "agent", "xlsx"]
categories = ["wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# Pure-Rust spreadsheet reader (XLSX, XLS, XLSB, ODS). Builds for wasm32-wasip2
# with default features; this agent only uses the in-memory reader
# (`open_workbook_auto_from_rs`), so no filesystem access is required and no
# native host handler is involved.
calamine = "0.37"
runtara-agent-macro = { workspace = true }
runtara-dsl = { workspace = true }
