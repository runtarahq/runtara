[package]
name = "runtara-agent-ai-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AI Tools integration agent — WebAssembly Component"
keywords = ["wasm", "component", "agent", "llm", "ai"]
categories = ["wasm", "web-programming::http-client"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
runtara-agent-macro = { workspace = true }
runtara-dsl = { workspace = true }
# Shared LLM completion logic for the `chat-completion` capability (the Ai Agent
# loop's LLM call). `default-features = false` drops `tracing` from the .wasm;
# `completion` brings the provider clients and `run_completion_async`.
runtara-ai = { path = "../../runtara-ai", default-features = false, features = ["completion"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
runtara-http = { workspace = true, features = ["native"] }

[target.'cfg(target_family = "wasm")'.dependencies]
runtara-http = { workspace = true, features = ["wasi"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
