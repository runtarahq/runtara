[package]
name = "runtara-agent-compression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compression agent — ZIP archive operations as a WebAssembly Component"
keywords = ["wasm", "component", "agent", "compression"]
categories = ["wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.58"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# ZIP with the pure-Rust deflate backend only. `default-features = false` drops
# the optional bzip2 / zstd / lzma backends, which are the crate's only C
# dependencies and are unreachable from these capabilities — the agent
# constructs `CompressionMethod::Stored` and `::Deflated` and nothing else.
# What remains (flate2 -> miniz_oxide) compiles to wasm32-wasip2, which is why
# this agent no longer forwards to a native host handler.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
# Capability metadata stays beside the code: `#[capability_input]`,
# `#[capability_output]`, `#[capability]` emit `&'static CapabilityMeta` /
# `&'static InputTypeMeta` / `&'static OutputTypeMeta` items, and the host-only
# `agent_info()` fn collects them into a `runtara_dsl::agent_meta::AgentInfo`.
# A workspace `emit-meta` binary then serializes that to `meta.json` next to
# the `.wasm` — the JSON is a build artifact, never hand-edited.
runtara-agent-macro = { path = "../../runtara-agent-macro" }
runtara-dsl = { path = "../../runtara-dsl", default-features = false }
strum = { version = "0.26", features = ["derive"] }
