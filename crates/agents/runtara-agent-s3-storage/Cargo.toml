[package]
name = "runtara-agent-s3-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "S3-compatible storage integration agent — WebAssembly Component"
keywords = ["wasm", "component", "agent", "s3", "storage"]
categories = ["wasm", "web-programming::http-client"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono.workspace = true
sha2.workspace = true
hmac = "0.12"
url = "2"
urlencoding = "2"
hex = "0.4"
runtara-agent-trusted = { path = "../../runtara-agent-trusted" }
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
runtara-agent-macro = { workspace = true }
runtara-dsl = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
runtara-http = { workspace = true, features = ["native"] }

[target.'cfg(target_family = "wasm")'.dependencies]
runtara-http = { workspace = true, features = ["wasi"] }
