[package]
name = "runtara-agent-object-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Object Model CRUD agent — WebAssembly Component"
keywords = ["wasm", "component", "agent", "object-model"]
categories = ["wasm", "database"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uuid = { version = "1", features = ["v4"] }
runtara-database-contract = { path = "../../runtara-database-contract" }
runtara-object-model-core = { path = "../../runtara-object-model-core" }
wit-bindgen = "0.58"
serde = { workspace = true }
serde_json = { workspace = true }
runtara-agent-macro = { path = "../../runtara-agent-macro" }
runtara-dsl = { path = "../../runtara-dsl", default-features = false }





[features]
db-integration-tests = []

[[test]]
name = "native_sql_model"
path = "tests/native_sql_model.rs"
required-features = ["db-integration-tests"]

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
runtara-object-store = { path = "../../runtara-object-store" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
