# Zoho CRM v8, generated from Zoho's own OpenAPI files (one per resource),
# pinned to a commit of github.com/zoho/crm-oas.
agent:
  id: zoho-crm
  name: Zoho CRM
  description: Zoho CRM — records of any module (leads, contacts, deals, …), search, COQL queries, users and modules.
  integration_id: zoho_crm_oauth
  error_prefix: ZOHO
# `filters` and `cross_filters` of getRecords take nested filter objects no
# step input can carry; searchRecords' criteria and COQL cover filtering.
omit_parameters: [filters, cross_filters]
# A COQL query is a POST that only reads.
read_operations: [executeCOQLQuery]
# The spec types a record's `$append_values` as a string; the API takes an
# object of multi-select picklist fields (update-records, update-record,
# upsert-records).
field_types:
  RecordPutWriteDataItem:
    $append_values: &append_values
      type: object
      additionalProperties: {type: boolean}
      description: >-
        Multi-select picklist fields of this record, each mapped to `true` to add
        the values given to the record's own, or `false` to replace them (the
        default).
  RecordSinglePutWriteDataItem:
    $append_values: *append_values
