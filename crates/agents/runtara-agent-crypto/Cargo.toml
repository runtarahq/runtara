[package]
name = "runtara-agent-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Crypto agent — hashing and HMAC — as a WebAssembly component"
keywords = ["wasm", "component", "agent", "crypto"]
categories = ["wasm", "cryptography"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
sha1 = "0.10"
md-5 = "0.10"
hmac = { workspace = true }
runtara-agent-macro = { workspace = true }
runtara-dsl = { workspace = true }
strum = { version = "0.26", features = ["derive"] }
