[package]
name = "runtara-agent-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Text agent — string manipulation, regex, base64, templates — as a WebAssembly component"
keywords = ["wasm", "component", "agent", "text"]
categories = ["wasm", "text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
regex = "1"
# `json` enables the `tojson` filter (default features stay on).
minijinja = { version = "2.5", features = ["json"] }
runtara-agent-macro = { workspace = true }
runtara-dsl = { workspace = true }
runtara-agent-encoding = { path = "../../runtara-agent-encoding" }
strum = { version = "0.26", features = ["derive"] }
