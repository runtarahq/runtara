[package]
name = "runtara-api-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Exports runtara:api, the workflow API as a component interface, over wasi:http"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
runtara-workflow-sdk = { path = "../runtara-workflow-sdk" }
runtara-workflow-api = { path = "../runtara-workflow-api" }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true, features = ["async-spawn"] }
