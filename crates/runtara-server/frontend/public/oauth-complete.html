<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Runtara — Authorization</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f5f5f5;
        color: #333;
      }
      main {
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
      }
      .success {
        color: #16a34a;
      }
      .error {
        color: #dc2626;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1.5rem;
        border: none;
        border-radius: 4px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h2 id="title">Finishing authorization…</h2>
      <p id="detail"></p>
      <button id="close" type="button" hidden>Close</button>
    </main>
    <script src="./oauth-complete.js"></script>
  </body>
</html>
