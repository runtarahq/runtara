name: runtara-inventory-poc
services:
  postgres:
    extends:
      file: ../../docker-compose.yml
      service: postgres
  valkey:
    extends:
      file: ../../docker-compose.yml
      service: valkey
  runtara:
    extends:
      file: ../../docker-compose.yml
      service: runtara
    pull_policy: never
    image: ghcr.io/runtarahq/runtara@sha256:edcaabfb323ffd82a8a4b0942eceb6a42f9e41b797199be5f45bae67f31148ac
    environment:
      SERVER_PORT: "3080"
      TENANT_ID: inventory-poc
      RUNTARA_PROXY_ALLOWED_HOSTS: inventory
      RUNTARA_PROXY_ALLOW_HTTP_HOSTS: inventory
    ports: !override
      - "127.0.0.1:3080:8080"
  proxy:
    image: node:22
    network_mode: service:runtara
    depends_on:
      runtara:
        condition: service_healthy
    command: [node, -e, "require('net').createServer(s=>{const c=require('net').connect(3080,'127.0.0.1');s.pipe(c).pipe(s);c.on('error',()=>s.destroy());s.on('error',()=>c.destroy())}).listen(8080,'0.0.0.0')"]
  inventory:
    image: node:22
    working_dir: /app
    command: [node, server.mjs]
    environment:
      STATE_FILE: /data/state.json
      RUNTARA_API: http://runtara:8080
    volumes:
      - ./:/app:ro
      - inventory_data:/data
configs:
  pg-init:
    file: init.sql
volumes:
  postgres_data:
  valkey_data:
  runtara_data:
  inventory_data:
