[workspace]
resolver = "2"
members = [
    "crates/runtara-core",
    # PostgreSQL implementation of core's Persistence contract
    "crates/runtara-store-postgres",
    "crates/runtara-environment",
    # Workflow compilation library
    "crates/runtara-dsl",
    "crates/runtara-workflows",
    "crates/runtara-validation-wasm",
    "crates/runtara-agents",
    "crates/runtara-ai",
    "crates/runtara-http",
    "crates/runtara-workflow-stdlib",
    "crates/runtara-agent-macro",
    # Shared character-encoding vocabulary + detection/decoding for WASM agents
    "crates/runtara-agent-encoding",
    # Text parsing
    "crates/runtara-text-parser",
    # Connection management
    "crates/runtara-connections",
    # HTTP API server
    "crates/runtara-server",
    # Object model storage
    "crates/runtara-object-store",
    "crates/runtara-object-model-core",
    "crates/runtara-database-contract",
    # Every runtara WIT contract, and the per-agent package generator
    "crates/runtara-wit",
    # Guest helpers for trusted agents
    "crates/runtara-agent-trusted",
    # Typed agent suspension: caps, layout and guest types
    "crates/runtara-agent-suspension",
    # Control service contract: caps, codes, capacity share, start schema
    "crates/runtara-control-contract",
    # Isolated child-component package and invocation-path contract
    "crates/runtara-invocation-contract",
    # Workflow API v1 contract shared by the host and the guest SDK
    "crates/runtara-workflow-api",
    # Guest side of the workflow API, and a probe workflow built on it
    "crates/runtara-workflow-sdk",
    "crates/runtara-workflow-api-probe",
    # The workflow compiler as a WASI command, for a VM with no filesystem
    "crates/runtara-compile-guest",
    "crates/runtara-workflow-api-run",
    "crates/runtara-api-component",
    "crates/runtara-component-host",
    # An out-of-tree workflow runner delegating to the embedded one (M3.1).
    "crates/runtara-runner-delegate",
    # Content-addressed artifact storage (M3.2).
    "crates/runtara-artifact-store",
    # Every workflow agent component; scripts/build-agent-components.sh builds
    # each crate it finds here.
    "crates/agents/*",
    # Build tool: emits per-agent meta.json siblings to each .wasm by walking
    # the macro-emitted statics in every agent crate. Run by
    # scripts/build-agent-components.sh after `cargo component build`.
    "crates/runtara-agent-bundle-emit",
]
# The primary deliverable, so a bare `cargo build` builds the thing you ship and
# a bare `cargo run` starts the server (runtara-server sets `default-run`).
# Previously this was runtara-core, which meant `cargo build` silently checked
# one leaf library and `cargo run` started the core service instead of the API.
default-members = ["crates/runtara-server"]

[workspace.package]
edition = "2024"
# Matches rust-toolchain.toml's pinned channel. Declared so the MSRV is part of
# crate metadata rather than implied only by the toolchain file, and so cargo
# reports a clear "requires rustc X" instead of a random type error on an older
# compiler.
rust-version = "1.97"
version = "10.0.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/runtarahq/runtara"
homepage = "https://runtara.com"
keywords = ["durable", "workflow", "checkpoint", "execution"]
categories = ["asynchronous", "development-tools"]

[workspace.dependencies]
runtara-http = { path = "crates/runtara-http", version = "10.0", default-features = false }
# Shared by every agent component under crates/agents. Agents pick runtara-http's
# `native` feature (ureq) on the host and `wasi` (typed outbound host calls) in
# WASM; connection IDs and routing controls are explicit request fields, and
# credential injection and request signing stay in the native host service.
# Capability metadata stays beside the code: runtara-agent-macro's
# `#[capability_input]`, `#[capability_output]` and `#[capability]` emit static
# metadata items, the host-only `agent_info()` fn collects them into a
# `runtara_dsl::agent_meta::AgentInfo`, and `emit-meta` serializes that to the
# `meta.json` beside each `.wasm` — the JSON is a build artifact, never
# hand-edited. runtara-dsl's default features are off to keep them out of the
# `.wasm`.
wit-bindgen = "0.58"
runtara-agent-macro = { path = "crates/runtara-agent-macro", version = "10.0" }
runtara-dsl = { path = "crates/runtara-dsl", version = "10.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip` makes float parsing correctly rounded. Without it serde_json's
# fast path can move a value by one ULP on parse, and workflow values are
# re-parsed at every step boundary, so a number could change between steps.
# Every crate, host and wasm32, must take serde_json from here.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
# Character-encoding detection + decoding, shared by the text/csv/xml agents
# through `runtara-agent-encoding`. encoding_rs is the WHATWG label/alias table
# and decoder; chardetng (same upstream) is the statistical detector and returns
# an `encoding_rs::Encoding`, so the two share one vocabulary.
encoding_rs = "0.8"
chardetng = "1.0"

# Build dependency crates at opt-level=2 in the dev/test profile. The WASM test
# suites (e.g. direct_wasm_execute) drive wasmtime's Cranelift JIT and wac-graph
# composition — both dependency crates — for every case; left unoptimized they
# dominate test wall-clock. Optimizing only dependencies keeps first-party crate
# rebuilds fast for incremental dev; the one-time dep build is cached in CI.
[profile.dev.package."*"]
opt-level = 2
