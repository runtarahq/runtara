# Runtara evaluation stack, with workflows on executors.
#
#   docker compose -f docker-compose.yml -f docker-compose.executor.yml up
#
# An overlay on docker-compose.yml: it adds an `executor` service and has the
# server place every workflow run with it (RUNTARA_RUNNER=executor) instead of
# running workflows in its own process. Each run is then a WebAssembly guest
# in a sandboxed process of its own, in a container that holds no database
# connection and none of the server's keys. See docs/executor.md.
#
# Workflows are compiled there too: the server places the compiler on an
# executor as a guest like a run, and does not compile in its own process
# (docs/compiler-on-an-executor.md). The compiler it places is in the image,
# beside the components. A workflow saved while no executor is up is not
# compiled until one is.
#
# The server is told of no executor: each one tells the server it is here.
# For more of them, say how many:
#   RUNTARA_EXECUTORS=3 docker compose -f docker-compose.yml -f docker-compose.executor.yml up
# or change it while the stack runs, with `--scale executor=3` on the same
# command. Each takes RUNTARA_EXECUTOR_MAX_RUNS runs at once (default 16).
#
# The server and the executors authenticate each other with certificates of a
# CA made on first start (`executor-pki`). The server and the executors each
# have their key on a volume of their own; the CA's key is kept nowhere. To
# make new certificates, remove both volumes and start again:
#   docker compose -f docker-compose.yml -f docker-compose.executor.yml down
#   docker volume rm <project>_executor_pki_server <project>_executor_pki_executor
#
# The sandbox needs seccomp and Landlock from the host's kernel (Linux 5.13
# or newer; Docker Desktop and current distributions have both). An executor
# checks at start and refuses to run without them.

services:
  # One-shot: the deployment's certificates, unless they are already there.
  # Runs as root to write to the fresh volumes, then hands the files to the
  # image's unprivileged user.
  executor-pki:
    image: ghcr.io/runtarahq/runtara:${RUNTARA_IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    user: "0:0"
    healthcheck:
      disable: true
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -s /pki/server/tls.key ] || [ ! -s /pki/executor/tls.key ]; then
          runtara-executor init-pki --server-dir /pki/server --executor-dir /pki/executor --replace || exit 1
        fi
        chown -R 10001:0 /pki/server /pki/executor
    volumes:
      - executor_pki_server:/pki/server
      - executor_pki_executor:/pki/executor

  executor:
    image: ghcr.io/runtarahq/runtara:${RUNTARA_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      executor-pki:
        condition: service_completed_successfully
    command: ["runtara-executor"]
    deploy:
      replicas: ${RUNTARA_EXECUTORS:-1}
    # The image's health check asks the server's port; this is not the server.
    healthcheck:
      disable: true
    # An executor that is stopped tells the server, which recovers its runs
    # at once.
    stop_grace_period: 15s
    environment:
      RUNTARA_EXECUTOR_LISTEN: "0.0.0.0:7443"
      # The server's run channel: where this executor says it is here.
      RUNTARA_EXECUTOR_SERVER_URL: "https://runtara:7444"
      RUNTARA_EXECUTOR_TLS_DIR: /pki
      # Compiled workflows, on the image's own /data volume: each executor
      # has its own, and nothing there is needed after a restart.
      RUNTARA_EXECUTOR_STATE_DIR: /data/executor
      RUNTARA_EXECUTOR_MAX_RUNS: "${RUNTARA_EXECUTOR_MAX_RUNS:-16}"
    volumes:
      - executor_pki_executor:/pki:ro

  runtara:
    depends_on:
      executor-pki:
        condition: service_completed_successfully
    environment:
      RUNTARA_RUNNER: executor
      RUNTARA_EXECUTOR_TLS_DIR: /pki
      # Where executors say they are here, fetch workflows and send their
      # runs' workflow API calls. Mutual TLS, and on the stack's private
      # network only: the port is not published.
      RUNTARA_RUN_CHANNEL_LISTEN: "0.0.0.0:7444"
      RUNTARA_RUN_CHANNEL_ENDPOINT: "https://runtara:7444"
    volumes:
      - executor_pki_server:/pki:ro

volumes:
  executor_pki_server:
  executor_pki_executor:
