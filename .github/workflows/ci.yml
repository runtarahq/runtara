name: CI

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
  pull_request:
    branches:
      - main

# Supersede in-flight runs for the same ref. Without this, every push to a
# branch left its predecessor running to completion, burning runner minutes and
# (worse) cache-write slots against the repo's 10 GB budget.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default-deny: every job reads source via actions/checkout. No job needs
# to write to issues, PRs, releases, packages, etc. Per-job overrides go
# at the job level if ever required.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # Full DWARF costs ~25% of compile wall-clock and inflates the target dir from
  # 19 GB to 54 GB (measured, `--workspace --all-targets --features GATE_FEATURES`).
  # rust-cache then compresses ~900 MB per job instead of ~320 MB, and ten of those
  # blow the 10 GB per-repo cache cap, which is what evicted the build and lint
  # caches on every run. line-tables-only keeps file/line in panics and backtraces
  # and only drops the variable-level DWARF a debugger would attach for. Set here
  # rather than in [profile.dev] so local builds keep full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Every marker feature that gates a [[test]] target via required-features,
  # plus embed-ui. Used by the lint and build jobs so `--all-targets` really
  # means all targets. Static value — no workflow-context interpolation.
  GATE_FEATURES: >-
    runtara-server/embed-ui,runtara-server/db-integration-tests,runtara-server/valkey-integration-tests,runtara-server/valkey-tls-integration-tests,runtara-object-store/db-integration-tests,runtara-environment/db-integration-tests,runtara-store-postgres/db-integration-tests,runtara-component-host/component-integration-tests,runtara-workflows/direct-wasm-integration-tests
  WASM_PACK_VERSION: "0.13.1"
  WIT_DEPS_VERSION: "0.6.0"
  WASM_TOOLS_VERSION: "1.252.0"

jobs:
  notify-start:
    # Only fire on push-to-main or PRs from this repo (not forks, not Dependabot).
    # Forks and Dependabot runs can't read SLACK_WEBHOOK_URL (GitHub withholds repo
    # secrets from them), so curl would hit an empty URL and fail the job.
    if: |
      github.actor != 'dependabot[bot]' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack — build started
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_NUM: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc \
            --arg repo "$REPO" \
            --arg ref "$REF" \
            --arg actor "$ACTOR" \
            --arg run_num "$RUN_NUM" \
            --arg run_url "$RUN_URL" \
            '{text: ":hourglass_flowing_sand: CI started — \($repo) on `\($ref)` by \($actor) (<\($run_url)|run #\($run_num)>)"}')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_URL"

  # The `embed-ui` feature (in GATE_FEATURES) makes rust_embed pull
  # frontend/dist into the server binary, so `lint` and `build` both need a
  # built frontend. They used to build it themselves — two full `npm ci &&
  # npm run build` runs, each installing wasm-pack and compiling the
  # validation WASM. Build it once here and share it instead.
  #
  # The artifact carries BOTH outputs on purpose. build.rs re-derives the
  # validation-WASM fingerprint and, if it disagrees with the one in
  # src/wasm/validation/, shells out to wasm-pack itself and then re-runs
  # `npm run build`. Shipping the fingerprint file alongside dist/ keeps it on
  # the up-to-date path, which is why the consumers below need neither
  # wasm-pack nor Node. (Verified: build.rs logs "Browser validation WASM is
  # up-to-date" and never trips its REBUILDING FRONTEND DIST branch.)
  frontend-embed:
    name: frontend (embedded UI)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. PR runs read main's cache and never add to the
          # 10 GB per-repo budget — the churn that was evicting these caches
          # into partial matches ("full match: false") on nearly every run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: crates/runtara-server/frontend/.node-version
          cache: npm
          cache-dependency-path: crates/runtara-server/frontend/package-lock.json

      - name: Install wasm-pack (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Build frontend (embedded UI)
        working-directory: crates/runtara-server/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Two paths, so the artifact root is their common ancestor
      # (crates/runtara-server/frontend) and both trees restore in place.
      - name: Upload frontend (embedded UI)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-embed
          path: |
            crates/runtara-server/frontend/dist/
            crates/runtara-server/frontend/src/wasm/validation/
          if-no-files-found: error
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    needs: frontend-embed

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. PR runs read main's cache and never add to the
          # 10 GB per-repo budget — the churn that was evicting these caches
          # into partial matches ("full match: false") on nearly every run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download frontend (embedded UI)
        uses: actions/download-artifact@v4
        with:
          name: frontend-embed
          path: crates/runtara-server/frontend

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The *-integration-tests features are empty markers that gate [[test]]
      # targets via required-features. Without them cargo silently drops those
      # targets, so ~78% of the LOC under tests/ was never linted or even
      # type-checked here — including the 11k-line direct_wasm_execute.rs.
      # Enabling them changes no produced binary; it only widens what compiles.
      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets \
            --features "$GATE_FEATURES" -- -D warnings

  build:
    runs-on: ubuntu-latest
    needs: frontend-embed

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. PR runs read main's cache and never add to the
          # 10 GB per-repo budget — the churn that was evicting these caches
          # into partial matches ("full match: false") on nearly every run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download frontend (embedded UI)
        uses: actions/download-artifact@v4
        with:
          name: frontend-embed
          path: crates/runtara-server/frontend

      - name: Build
        run: |
          cargo build --workspace --all-targets \
            --features "$GATE_FEATURES"

  test-sdk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      # Under resolver v2 a `-p <crate> --features …` invocation resolves features
      # over that crate's subgraph, which differs from the workspace-wide
      # resolution `build` uses. Verified: this job rebuilt 80 third-party crates
      # (wasmtime, cranelift, sqlx, openssl) straight after restoring a 1.3 GB
      # target dir `build` had produced minutes earlier in the same run. A cache
      # keyed on the build job's resolution can never serve these jobs, so each
      # keeps its own job-scoped key instead.
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. PR runs read main's cache and never add to the
          # 10 GB per-repo budget — the churn that was evicting these caches
          # into partial matches ("full match: false") on nearly every run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run runtara-sdk tests
        run: cargo test -p runtara-sdk

  test-workflows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      # Under resolver v2 a `-p <crate> --features …` invocation resolves features
      # over that crate's subgraph, which differs from the workspace-wide
      # resolution `build` uses. Verified: this job rebuilt 80 third-party crates
      # (wasmtime, cranelift, sqlx, openssl) straight after restoring a 1.3 GB
      # target dir `build` had produced minutes earlier in the same run. A cache
      # keyed on the build job's resolution can never serve these jobs, so each
      # keeps its own job-scoped key instead.
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. PR runs read main's cache and never add to the
          # 10 GB per-repo budget — the churn that was evicting these caches
          # into partial matches ("full match: false") on nearly every run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run runtara-workflows tests
        run: cargo test -p runtara-workflows

  test-core:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runtara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      # Under resolver v2 a `-p <crate> --features …` invocation resolves features
      # over that crate's subgraph, which differs from the workspace-wide
      # resolution `build` uses. Verified: this job rebuilt 80 third-party crates
      # (wasmtime, cranelift, sqlx, openssl) straight after restoring a 1.3 GB
      # target dir `build` had produced minutes earlier in the same run. A cache
      # keyed on the build job's resolution can never serve these jobs, so each
      # keeps its own job-scoped key instead.
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. PR runs read main's cache and never add to the
          # 10 GB per-repo budget — the churn that was evicting these caches
          # into partial matches ("full match: false") on nearly every run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Core owns no storage engine, so its tests need no database: the
      # in-memory backend runs the conformance suite here, and the Postgres
      # backend runs the same suite in the store crate's own job below.
      - name: Run runtara-core tests
        run: cargo test -p runtara-core --features test-support -- --test-threads=1

      - name: Run runtara-store-postgres tests
        env:
          TEST_RUNTARA_DATABASE_URL: postgres://postgres:postgres@localhost:5432/runtara_test
        run: cargo test -p runtara-store-postgres --features db-integration-tests -- --test-threads=1

  test-server:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runtara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      # Under resolver v2 a `-p <crate> --features …` invocation resolves features
      # over that crate's subgraph, which differs from the workspace-wide
      # resolution `build` uses. Verified: this job rebuilt 80 third-party crates
      # (wasmtime, cranelift, sqlx, openssl) straight after restoring a 1.3 GB
      # target dir `build` had produced minutes earlier in the same run. A cache
      # keyed on the build job's resolution can never serve these jobs, so each
      # keeps its own job-scoped key instead.
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. PR runs read main's cache and never add to the
          # 10 GB per-repo budget — the churn that was evicting these caches
          # into partial matches ("full match: false") on nearly every run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The service container creates only POSTGRES_DB. The runtime schema needs
      # a database of its own — see the note on TEST_RUNTARA_DATABASE_URL below.
      - name: Create the runtime-schema database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE runtara_runtime_test;'

      - name: Run runtara-server tests
        # Explicit features include the Postgres and plaintext-Valkey suites;
        # both fail closed when their required services are unavailable.
        env:
          TEST_RUNTARA_SERVER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/runtara_test
          # tests/core_instance_api.rs drives CoreRuntime against the *runtime*
          # schema, not the server one, so it reads this separate variable and
          # panics without it.
          #
          # It must be its own database, not runtara_test. Both schemas track
          # their state in the same `_sqlx_migrations` table, so a core migrator
          # pointed at the server's database sees the server's rows as unknown
          # versions and aborts with VersionMissing(20250101000000). Sharing is
          # only safe for a consumer that runs no migrations of its own, which
          # is why object-store can reuse runtara_test below and this cannot.
          TEST_RUNTARA_DATABASE_URL: postgres://postgres:postgres@localhost:5432/runtara_runtime_test
          TEST_REPORTS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          VALKEY_HOST: localhost
          VALKEY_PORT: "6379"
        run: cargo test -p runtara-server --features db-integration-tests,valkey-integration-tests -- --test-threads=1

      - name: Run object-store PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/runtara_test
        run: cargo test -p runtara-object-store --features db-integration-tests --test integration -- --test-threads=1

      - name: Run TLS-only Valkey integration tests
        run: scripts/test-valkey-tls.sh

  test-environment:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runtara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      # Under resolver v2 a `-p <crate> --features …` invocation resolves features
      # over that crate's subgraph, which differs from the workspace-wide
      # resolution `build` uses. Verified: this job rebuilt 80 third-party crates
      # (wasmtime, cranelift, sqlx, openssl) straight after restoring a 1.3 GB
      # target dir `build` had produced minutes earlier in the same run. A cache
      # keyed on the build job's resolution can never serve these jobs, so each
      # keeps its own job-scoped key instead.
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. PR runs read main's cache and never add to the
          # 10 GB per-repo budget — the churn that was evicting these caches
          # into partial matches ("full match: false") on nearly every run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run runtara-environment tests
        env:
          TEST_ENVIRONMENT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/runtara_test
        run: cargo test -p runtara-environment --features db-integration-tests -- --test-threads=1

  # Every crate's inline #[cfg(test)] unit tests, in ONE invocation.
  #
  # `--workspace --lib` needs no Postgres, Valkey or Docker (verified: 3,508
  # tests, 0 failures on a bare machine), so it is the cheap gate that covers
  # the whole workspace — including the 14 crates that the other, -p-enumerated
  # jobs never named and therefore never tested: runtara-dsl (253 test fns),
  # runtara-workflow-stdlib (190), runtara-report-dsl,
  # runtara-text-parser, runtara-sdk-macros, runtara-ai, runtara-validation-wasm,
  # runtara-http, runtara-agent-encoding, runtara-workflow-runtime,
  # runtara-workflow-wit and both partially-skipped crates.
  #
  # Being workspace-wide rather than a list, a NEW crate is covered on the day
  # it is added instead of defaulting to untested forever. It also subsumes the
  # old per-agent loop, which ran `-p <crate> --lib` 27 times and whose glob
  # (crates/agents/runtara-agent-*) silently missed runtara-agent-encoding,
  # since that crate lives at crates/runtara-agent-encoding.
  #
  # Service-bound integration targets stay in their own jobs below.
  test-units:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      # Under resolver v2 a `-p <crate> --features …` invocation resolves features
      # over that crate's subgraph, which differs from the workspace-wide
      # resolution `build` uses. Verified: this job rebuilt 80 third-party crates
      # (wasmtime, cranelift, sqlx, openssl) straight after restoring a 1.3 GB
      # target dir `build` had produced minutes earlier in the same run. A cache
      # keyed on the build job's resolution can never serve these jobs, so each
      # keeps its own job-scoped key instead.
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. PR runs read main's cache and never add to the
          # 10 GB per-repo budget — the churn that was evicting these caches
          # into partial matches ("full match: false") on nearly every run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Every crate's lib target, workspace-wide, one cargo invocation.
      - name: Run all workspace unit tests
        run: cargo test --workspace --lib

      # `--lib` above selects ONLY library targets, so every tests/ directory in
      # the workspace is invisible to it. Each crate whose integration tests are
      # hermetic (no Docker, no database) is named here; the ones that need a
      # container get their own job. When you add a tests/ file to a crate that
      # is not listed in some CI step, nothing runs it — that is how the
      # connection-form drift detector sat red from 2026-08-13 to 2026-08-25.
      - name: Run hermetic integration tests
        run: |
          cargo test --tests \
            -p runtara-agent-macro \
            -p runtara-agents \
            -p runtara-agent-mcp

  # runtara-connections owns 12 integration tests and had no CI job at all.
  # Eight of them provision their own Postgres through testcontainers, so this
  # needs Docker (present on ubuntu-latest) but no `services:` block. Serialized
  # because the suites share container ports and the connection tables.
  test-connections:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      # Under resolver v2 a `-p <crate> --features …` invocation resolves features
      # over that crate's subgraph, which differs from the workspace-wide
      # resolution `build` uses. Verified: this job rebuilt 80 third-party crates
      # (wasmtime, cranelift, sqlx, openssl) straight after restoring a 1.3 GB
      # target dir `build` had produced minutes earlier in the same run. A cache
      # keyed on the build job's resolution can never serve these jobs, so each
      # keeps its own job-scoped key instead.
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. PR runs read main's cache and never add to the
          # 10 GB per-repo budget — the churn that was evicting these caches
          # into partial matches ("full match: false") on nearly every run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run runtara-connections tests
        run: cargo test -p runtara-connections -- --test-threads=1

  # WIT-only sanity: the canonical agent contract package parses and its
  # wasi:* dependency tree resolves. Cheap; catches deps.toml / lockfile drift
  # before any agent crate tries to consume it.
  wit-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # These were `cargo install`-from-source behind an actions/cache of the
      # built binary. Both caches are only a few MB, which made them the first
      # things evicted once the repo went over its 10 GB budget — so the fallback
      # ran on nearly every run: 89s for wit-deps plus 128s for wasm-tools, on the
      # wit-package -> components-build critical path. Prebuilt downloads are a
      # few seconds and cannot be evicted. install-action falls back to
      # cargo-binstall, then to a source build, for anything it has no binary for.
      - name: Install WIT tooling (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }},wit-deps-cli@${{ env.WIT_DEPS_VERSION }}

      - name: Lock and resolve WIT dependencies
        working-directory: crates/runtara-agent-wit
        run: wit-deps lock

      - name: Validate WIT package
        run: wasm-tools component wit crates/runtara-agent-wit/wit > /dev/null

  # Build every runtara-agent-* crate as a WASM component, emit each agent's
  # macro-derived meta.json sidecar, and run the dispatcher integration tests
  # (including the full-bundle drift detector that calls every declared
  # capability against its real .wasm and asserts no UNKNOWN_CAPABILITY).
  components-build:
    runs-on: ubuntu-latest
    needs: wit-package

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip2
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes. PR runs read main's cache and never add to the
          # 10 GB per-repo budget — the churn that was evicting these caches
          # into partial matches ("full match: false") on nearly every run.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build all agent components + emit sidecar meta.json
        env:
          # Tools are installed explicitly above. Fail loudly if anything's
          # missing instead of silently re-installing inside the script.
          RUNTARA_NO_INSTALL_TOOLS: "1"
        run: scripts/build-agent-components.sh

      - name: Verify every agent component + meta.json is present
        run: |
          # Expected = one component per agent crate under crates/agents/. Derived
          # (not hardcoded) so adding an agent never breaks this check; it still
          # catches a component that silently failed to build or emit its meta.
          expected=$(ls -d crates/agents/runtara-agent-*/ | wc -l)
          wasm_count=$(find target/wasm32-wasip2/release -maxdepth 1 -name 'runtara_agent_*.wasm' | wc -l)
          meta_count=$(find target/wasm32-wasip2/release -maxdepth 1 -name 'runtara_agent_*.meta.json' | wc -l)
          echo "expected=$expected wasm=$wasm_count meta=$meta_count"
          test "$wasm_count" -eq "$expected"
          test "$meta_count" -eq "$expected"

      - name: Run dispatcher integration tests (incl. full-bundle drift detector)
        run: cargo test -p runtara-component-host --features component-integration-tests --tests

      # Direct WASM smoke: use the staged stdlib/runtime/agent component
      # bundle, then compile direct workflow fixtures, compose them in-process
      # (wac-graph), execute the final artifacts, and assert the fake SDK
      # observed the expected completion/failure/events for the supported
      # feature classes. This is the gate that catches drift between the
      # per-agent WIT, the emitted workflow-logic module, and the in-process
      # composition graph.
      - name: Run direct WASM workflow execution smoke tests
        env:
          RUNTARA_AGENT_COMPONENTS_DIR: ${{ github.workspace }}/target/wasm32-wasip2/release
        # Unlike the db-integration suites above (which serialize on a shared
        # Postgres/Valkey), this suite owns no shared external resource: each
        # test binds an ephemeral port for its own mock, executes the workflow
        # in-process on a fresh wasmtime Store, and passes env per-run — so it is
        # safe at the default thread count. The compile happens off the executor
        # lock, so N tests compile concurrently. The few wall-clock-sensitive
        # parallel-split tests self-serialize via PARALLEL_TIMING_LOCK.
        run: |
          cargo test -p runtara-workflows \
            --features direct-wasm-integration-tests \
            --test direct_wasm_execute

  notify-result:
    # Posts success or failure once all build/test jobs finish.
    # Skipped on cancellation (avoids spurious "failure" pings when a run is
    # superseded by a new push).
    needs:
      - frontend-embed
      - lint
      - build
      - test-sdk
      - test-workflows
      - test-core
      - test-server
      - test-environment
      - test-units
      - test-connections
      - wit-package
      - components-build
    if: |
      !cancelled() && github.actor != 'dependabot[bot]' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack — build result
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_NUM: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # "skipped" counts as bad, not neutral. Jobs here now form a chain
          # (frontend-embed -> lint/build -> test-*), so an early failure leaves
          # everything downstream "skipped" rather than "failure" — matching only
          # on "failure" would report a green CI for a run that never compiled.
          # cancelled() runs are already filtered out by the `if:` above, so a
          # skip reaching this point always means an upstream job failed.
          failed=$(echo "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result == "failure" or .value.result == "skipped")) | map(.key) | join(", ")')
          if [ -z "$failed" ]; then
            emoji=":white_check_mark:"
            msg="CI passed"
          else
            emoji=":x:"
            msg="CI failed: $failed"
          fi
          payload=$(jq -nc \
            --arg emoji "$emoji" \
            --arg msg "$msg" \
            --arg repo "$REPO" \
            --arg ref "$REF" \
            --arg actor "$ACTOR" \
            --arg run_num "$RUN_NUM" \
            --arg run_url "$RUN_URL" \
            '{text: "\($emoji) \($msg) — \($repo) on `\($ref)` by \($actor) (<\($run_url)|run #\($run_num)>)"}')
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_URL"
