name: Frontend

# Ported from crates/runtara-server/frontend/.github/workflows/pr-checks.yml,
# which had never executed: GitHub Actions only discovers workflows in
# .github/workflows/ at the REPOSITORY ROOT, and that file sits inside the
# frontend directory. The frontend was merged into this Rust repo with its
# CI still written as if it were the repo root, so ~36,600 LOC of frontend
# tests (90 vitest files / 1,105 cases, plus the Playwright specs) never ran.
#
# Every job therefore sets `working-directory: crates/runtara-server/frontend`.
#
# Job split rationale:
#   - lint / format            -> Node only, no dependencies. Fast feedback.
#   - typecheck / unit / knip  -> Node only, but they resolve
#     `@/wasm/validation/runtara_validation.js`, which is *generated* by
#     wasm-pack and gitignored (see .gitignore). Only `npm run build` builds it,
#     via the `prebuild` hook -> build:wasm-validation ->
#     scripts/build-validation-wasm.mjs. `npm test` and `tsc -b` have no such
#     hook, so without it these jobs fail on an unresolved import (22 of 97
#     vitest files, 3 tsc errors). They therefore consume the `validation-wasm`
#     artifact rather than each paying for a Rust toolchain.
#   - validation-wasm          -> the only job with a Rust toolchain. Builds
#     that WASM once and uploads it.
#   - build / e2e-mocked       -> run the real `npm run build`. Its `prebuild`
#     hook re-runs the build script, but the downloaded artifact carries the
#     fingerprint the script compares against, so it exits early instead of
#     shelling out to wasm-pack. They consume the artifact for that reason and
#     need no Rust of their own.
#
# lint and format deliberately do NOT depend on validation-wasm: eslint.config.js
# ignores src/wasm outright and prettier is purely syntactic, so neither needs the
# generated module. Keeping them off the dependency edge preserves ~35s feedback
# on a formatting slip instead of queueing it behind a Rust build.

on:
  push:
    branches:
      - '**'
    paths:
      - 'crates/runtara-server/frontend/**'
      - '.github/workflows/frontend.yml'
      # The validation WASM the frontend imports is built from these.
      - 'crates/runtara-validation-wasm/**'
      - 'crates/runtara-workflows/**'
      - 'crates/runtara-dsl/**'
  pull_request:
    branches:
      - main

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FRONTEND_DIR: crates/runtara-server/frontend
  WASM_PACK_VERSION: "0.13.1"

defaults:
  run:
    working-directory: crates/runtara-server/frontend

jobs:
  # ------------------------------------------- Rust: the shared WASM artifact
  # Builds the browser validation bundle once so the Node-only jobs that import
  # it don't each need a Rust toolchain. Note this runs the build script
  # directly and skips `npm ci`: scripts/build-validation-wasm.mjs uses only
  # node builtins, so node_modules is dead weight here.
  validation-wasm:
    name: validation wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version-file: crates/runtara-server/frontend/.node-version

      - name: Add Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache wasm-pack binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ env.ImageOS }}-${{ runner.arch }}-${{ env.WASM_PACK_VERSION }}

      - name: Install wasm-pack
        run: |
          if command -v wasm-pack >/dev/null 2>&1 \
            && wasm-pack --version | grep -q "wasm-pack ${WASM_PACK_VERSION}"; then
            echo "wasm-pack ${WASM_PACK_VERSION} already installed"
          else
            cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked --force
          fi

      - name: Build validation WASM
        run: npm run build:wasm-validation

      # `if-no-files-found: error` so a silently-empty artifact fails here
      # rather than downstream as a confusing unresolved import.
      - name: Upload validation WASM
        uses: actions/upload-artifact@v4
        with:
          name: validation-wasm
          path: crates/runtara-server/frontend/src/wasm/validation/
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------- Node only, no WASM needed
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: lint, cmd: 'npm run lint' }
          - { name: format, cmd: 'npm run format:check' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: crates/runtara-server/frontend/.node-version
          cache: npm
          cache-dependency-path: crates/runtara-server/frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      # `npm run lint` gates on ESLint *errors* (0 today). It is deliberately
      # NOT run with --max-warnings=0: 26 of the 34 current warnings are
      # react-refresh/only-export-components, an HMR-ergonomics rule whose fix
      # is splitting 26 files. The 4 react-hooks/exhaustive-deps warnings are
      # the ones worth acting on; tighten this once they are addressed.
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}

  # ------------------------------------------- Node only, but needs the WASM
  checks-wasm:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    needs: validation-wasm
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: typecheck, cmd: 'npx tsc -b --pretty' }
          - { name: unit, cmd: 'npm test' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: crates/runtara-server/frontend/.node-version
          cache: npm
          cache-dependency-path: crates/runtara-server/frontend/package-lock.json

      - name: Download validation WASM
        uses: actions/download-artifact@v4
        with:
          name: validation-wasm
          path: crates/runtara-server/frontend/src/wasm/validation

      - run: npm ci --no-audit --no-fund

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}

  # knip (dead-code detection) reports 4 genuinely unused exports today, so it
  # is informational rather than gating. Flip continue-on-error off once those
  # are resolved. It needs the WASM too, otherwise it also reports the two
  # generated imports as unresolved.
  knip:
    name: knip (informational)
    runs-on: ubuntu-latest
    needs: validation-wasm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: crates/runtara-server/frontend/.node-version
          cache: npm
          cache-dependency-path: crates/runtara-server/frontend/package-lock.json
      - name: Download validation WASM
        uses: actions/download-artifact@v4
        with:
          name: validation-wasm
          path: crates/runtara-server/frontend/src/wasm/validation
      - run: npm ci --no-audit --no-fund
      - run: npm run knip

  # ------------------------------------------------- Node + Rust (wasm-pack)
  build:
    name: build
    runs-on: ubuntu-latest
    needs: validation-wasm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: crates/runtara-server/frontend/.node-version
          cache: npm
          cache-dependency-path: crates/runtara-server/frontend/package-lock.json

      - name: Download validation WASM
        uses: actions/download-artifact@v4
        with:
          name: validation-wasm
          path: crates/runtara-server/frontend/src/wasm/validation

      - run: npm ci --no-audit --no-fund

      # `prebuild` (build:wasm-validation) still runs, but the downloaded output
      # carries the fingerprint the script compares against, so it exits early
      # with "up-to-date". That leaves tsc -b + vite — no Rust, no wasm-pack.
      - run: npm run build

  e2e-mocked:
    name: E2E (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validation-wasm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: crates/runtara-server/frontend/.node-version
          cache: npm
          cache-dependency-path: crates/runtara-server/frontend/package-lock.json

      - name: Download validation WASM
        uses: actions/download-artifact@v4
        with:
          name: validation-wasm
          path: crates/runtara-server/frontend/src/wasm/validation

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build app
        run: npm run build

      - name: Serve preview build
        run: |
          npm run preview -- --port 8081 &
          npx wait-on http://localhost:8081 --timeout 60000

      - name: Run mocked Playwright project
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8081
          CI: 'true'
        run: npx playwright test --project=mocked

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mocked-report
          path: |
            crates/runtara-server/frontend/e2e-report/
            crates/runtara-server/frontend/e2e-results/
          retention-days: 14
