# Fixture for test_connector_gen.py. Each operation and schema exercises a
# spec shape the generator has to get right; the comments say which.
openapi: 3.0.1
info:
  title: Sample
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /items:
    get:
      operationId: listItems
      summary: List items
      tags: [items, admin]            # two tags: still rendered once
      parameters:
        - in: query
          name: ids                   # explode defaults to true: ids=1&ids=2
          schema:
            type: array
            items:
              type: integer
        - in: query
          name: tags                  # explode false: tags=a,b
          explode: false
          schema:
            type: array
            items:
              type: string
        - in: query
          name: limit                 # required with a default: stays required
          required: true
          schema:
            type: integer
            default: 50
        - in: query
          name: order                 # $ref to an enum schema
          schema:
            $ref: '#/components/schemas/SortOrder'
        - in: cookie
          name: session               # optional cookie: dropped
          schema:
            type: string
      responses:
        200:                          # unquoted response code
          description: All items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  /items/{id}:
    patch:
      operationId: updateItem
      summary: Update an item
      tags: [items]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                owner_id:
                  type: integer
                  nullable: true
                note:
                  type: string
      responses:
        '200':
          description: The updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
    delete:
      operationId: deleteItem         # no summary, no response body
      tags: [items]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /tags:
    get:
      operationId: countTags
      summary: Count items per tag
      tags: [items]
      responses:
        '200':
          description: Tag counts
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
  /count:
    get:
      operationId: countItems
      summary: Count items
      tags: [items]
      responses:
        '200':
          description: Item count
          content:
            application/json:
              schema:
                type: integer
components:
  schemas:
    SortOrder:
      type: string
      enum: [asc, desc]
    Legacy:
      type: object
      properties:
        state:
          type: string
          enum: [a, b]
    Item:
      type: object
      properties:
        id:
          type: integer               # no format: generated as i64
        name:
          type: string
          description: 'Shown as "Name" & stored as is'
        owner_id:
          type: integer
          nullable: true
        priority:
          type: integer               # integer enum
          enum: [1, 2, 3]
        state:
          type: string                # string enum; unlisted values pass through
          enum: [open, closed]
        value:
          anyOf:
            - type: string
            - type: number
        properties:                   # a property literally named "properties"
          type: object
          example:
            color: red
          properties:
            color:
              type: string
        legacy_state:
          $ref: '#/components/schemas/Legacy/properties/state'
